<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoreo Realtime - Risk Manager</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Boxicons for premium icons -->
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <!-- Base App Styles -->
    <link rel="stylesheet" href="styles.css?v=84">
    <!-- Custom styling tailored for full screen monitor -->
    <style>
        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .monitoreo-wrapper {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            padding: 24px;
            gap: 20px;
            overflow-y: auto;
            max-width: 1600px;
            width: 100%;
            margin: 0 auto;
        }

        /* Top Bar styling */
        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            width: 100%;
            height: 70px;
            border-radius: 0;
            border-bottom: 1px solid var(--glass-border);
            flex-shrink: 0;
        }

        .header-logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-logo img {
            width: 32px;
            height: auto;
        }

        .header-logo h1 {
            font-size: 18px;
            font-weight: 700;
            margin: 0;
            color: var(--text-primary);
        }

        .header-logo h1 span {
            color: var(--accent-primary);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        /* Stats Cards Row */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            width: 100%;
        }

        .stat-widget {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            border-radius: var(--radius-md);
            border: 1px solid var(--glass-border);
            position: relative;
            overflow: hidden;
        }

        .stat-widget::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            height: 4px;
            width: 100%;
            background: linear-gradient(90deg, var(--accent-primary), var(--success));
        }

        .stat-widget.warning::after {
            background: linear-gradient(90deg, var(--warning), var(--danger));
        }

        .stat-widget-details h3 {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }

        .stat-widget-details .number {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .stat-widget-icon {
            font-size: 32px;
            color: var(--accent-primary);
            opacity: 0.8;
            background: rgba(59, 130, 246, 0.1);
            padding: 10px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stat-widget.warning .stat-widget-icon {
            color: var(--warning);
            background: rgba(245, 158, 11, 0.1);
        }

        /* Filters section */
        .filter-section {
            display: flex;
            gap: 15px;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            padding: 15px 20px;
            border-radius: var(--radius-md);
            border: 1px solid var(--glass-border);
        }

        .filter-group {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
            flex-grow: 1;
        }

        .filter-input-wrapper {
            position: relative;
            flex-grow: 1;
            max-width: 350px;
            min-width: 200px;
        }

        .filter-input-wrapper i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 18px;
        }

        .filter-input-wrapper input {
            padding-left: 38px;
            height: 40px;
            width: 100%;
        }

        .filter-select {
            height: 40px;
            min-width: 160px;
            border-radius: var(--radius-sm);
            background: var(--bg-secondary);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            padding: 0 10px;
            font-family: inherit;
            cursor: pointer;
            outline: none;
            transition: border-color 0.2s;
        }

        .filter-select:focus {
            border-color: var(--accent-primary);
        }

        /* Custom Scrollbar for wrapper */
        .monitoreo-wrapper::-webkit-scrollbar {
            width: 8px;
        }
        .monitoreo-wrapper::-webkit-scrollbar-track {
            background: transparent;
        }
        .monitoreo-wrapper::-webkit-scrollbar-thumb {
            background: var(--glass-border);
            border-radius: 10px;
        }
        .monitoreo-wrapper::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }

        /* Pulse live indicator */
        .pulse-live {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .pulse-live-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: var(--success);
            box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
            animation: pulse-ring 1.6s infinite;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="top-header glass-panel">
        <div class="header-logo">
            <img src="assets/src/img/logo.svg" alt="Risk Manager Logo">
            <h1>Risk <span>Manager</span> <span style="font-weight: 400; font-size: 14px; opacity: 0.8; color: var(--text-secondary);">| Monitoreo Realtime</span></h1>
        </div>
        <div style="display: flex; align-items: center; gap: 15px;">
            <div class="pulse-live">
                <div class="pulse-live-dot"></div>
                En Vivo
            </div>
            <div class="clock" id="liveClock" style="font-size: 18px; font-weight: 700; color: var(--accent-primary); letter-spacing: 0.5px; font-family: monospace; background: rgba(0,0,0,0.2); padding: 5px 12px; border-radius: 6px;">00:00:00</div>
        </div>
        <div class="header-actions">
            <button class="btn btn-icon" id="themeToggleBtn"><i class='bx bx-moon'></i></button>
            <button class="btn btn-outline" style="width: auto; padding: 8px 16px; display: flex; align-items: center; gap: 6px;" onclick="window.close();">
                <i class='bx bx-window-close'></i> Cerrar Panel
            </button>
        </div>
    </header>

    <!-- Main Wrapper -->
    <div class="monitoreo-wrapper">

        <!-- Stat Cards -->
        <div class="stats-grid">
            <!-- Total Activos -->
            <div class="stat-widget glass-panel">
                <div class="stat-widget-details">
                    <h3>Gestores Activos</h3>
                    <div class="number" id="statsGestores">0 / 0</div>
                </div>
                <div class="stat-widget-icon">
                    <i class='bx bx-group'></i>
                </div>
            </div>

            <!-- KPI Promedio -->
            <div class="stat-widget glass-panel">
                <div class="stat-widget-details">
                    <h3>KPI Promedio General</h3>
                    <div class="number" id="statsKpi">0%</div>
                </div>
                <div class="stat-widget-icon">
                    <i class='bx bx-line-chart'></i>
                </div>
            </div>

            <!-- Turno Predominante -->
            <div class="stat-widget glass-panel warning">
                <div class="stat-widget-details">
                    <h3>Turno en Curso</h3>
                    <div class="number" id="statsTurno">Cargando...</div>
                </div>
                <div class="stat-widget-icon">
                    <i class='bx bx-time-five'></i>
                </div>
            </div>
        </div>

        <!-- Filter Row -->
        <div class="filter-section glass-panel">
            <div class="filter-group">
                <div class="filter-input-wrapper">
                    <i class='bx bx-search'></i>
                    <input type="text" id="monitoreoSearchInput" class="modern-input" placeholder="Buscar por gestor...">
                </div>

                <select id="filterShiftSelect" class="filter-select">
                    <option value="">Todos los Turnos</option>
                    <option value="Mañana">Turno Mañana</option>
                    <option value="Tarde">Turno Tarde</option>
                    <option value="Noche">Turno Noche</option>
                    <option value="Master">Turno Master</option>
                </select>

                <select id="filterStatusSelect" class="filter-select">
                    <option value="">Todos los Estados</option>
                    <option value="online">En Línea</option>
                    <option value="offline">Inactivos</option>
                </select>
            </div>
            
            <button class="btn btn-outline" id="clearMonitoreoFiltersBtn" style="height: 40px; padding: 0 15px; display: flex; align-items: center; gap: 8px; width: auto;">
                <i class='bx bx-filter-alt'></i> Limpiar Filtros
            </button>
        </div>

        <!-- Grid layout of active managers -->
        <div class="monitoreo-grid" id="monitoreoGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; padding-bottom: 40px;">
            <!-- Renderizado dinámico -->
        </div>

    </div>

    <!-- Monitoreo Detail Modal -->
    <div id="monitoreoModal" class="modal-overlay">
        <div class="modal glass-panel" style="max-width: 600px; width: 90%;">
            <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 5px;">
                <img id="monitoreoModalAvatar" src="" alt="Avatar" style="width: 50px; height: 50px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent-primary);">
                <div>
                    <h2 id="monitoreoModalName" style="margin: 0; font-size: 20px; color: var(--text-primary);">Bitácora de Tareas</h2>
                    <div id="monitoreoModalInfo" style="font-size: 12px; color: var(--text-secondary);">Turno: Mañana | Activo hace poco</div>
                </div>
            </div>
            <hr style="border: 0; border-top: 1px solid var(--glass-border); margin: 15px 0;">
            <h3 style="font-size: 14px; color: var(--accent-primary); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px;"><i class='bx bx-task'></i> Detalle de Gestión de Tareas</h3>
            
            <div style="max-height: 350px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 5px;" id="monitoreoModalTasksList">
                <!-- Tareas del gestor se cargan dinámicamente -->
            </div>
            
            <div class="modal-actions" style="margin-top: 20px;">
                <button class="btn btn-outline" id="closeMonitoreoModalBtn" style="width: auto;">Cerrar</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <!-- Config shared -->
    <script src="firebase-config.js"></script>
    <!-- Custom logic for Realtime Dashboard -->
    <script src="monitoreo.js"></script>
</body>
</html>
